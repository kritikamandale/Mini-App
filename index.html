<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>
    <p class="subtitle">Add a task, check it off, or delete it. Your list stays after a refresh.</p>

    <form id="task-form">
      <label class="visually-hidden" for="task-input">New task</label>
      <input
        id="task-input"
        type="text"
        placeholder="What do you need to do?"
        maxlength="200"
        autocomplete="off"
        required
      >
      <button type="submit">Add</button>
    </form>

    <p id="empty-message">No tasks yet. Add one above.</p>
    <ul id="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
